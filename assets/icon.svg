<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161614"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff623e"/>
      <stop offset="100%" stop-color="#ff4820"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff4820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Viewfinder Corner Marks -->
  <!-- Top Left -->
  <path d="M88 152 V104 H136" fill="none" stroke="#ff4820" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Top Right -->
  <path d="M424 152 V104 H376" fill="none" stroke="#ff4820" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bottom Left -->
  <path d="M88 360 V408 H136" fill="none" stroke="#ff4820" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bottom Right -->
  <path d="M424 360 V408 H376" fill="none" stroke="#ff4820" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Aperture / Crosshair Lines -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Center Shutter Aperture / Stylized F & Frame -->
  <g filter="url(#glow)">
    <!-- Stylized Cinematic 'F' Glyph -->
    <path d="M188 160 H332 V216 H252 V248 H316 V300 H252 V352 H188 Z" fill="#f5f2ea"/>
    <!-- Accent Aperture Leaf on F -->
    <circle cx="326" cy="188" r="14" fill="url(#orangeGrad)"/>
    <!-- Red REC Dot -->
    <circle cx="372" cy="140" r="12" fill="#ff4820"/>
  </g>
</svg>