<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="FRAME — Portfolio of Tanmay Chavan. Photography, event coverage, motion reels, and video editing based in Pune, India. Shot on Samsung Galaxy S23.">
  <meta name="theme-color" content="#080807">
  <title>FRAME — Tanmay Chavan | Photography &amp; Videography</title>

  <!-- Open Graph / Social Sharing Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FRAME — Tanmay Chavan">
  <meta property="og:title" content="FRAME — Tanmay Chavan | Photography &amp; Videography">
  <meta property="og:description"
    content="Visual portfolio of Tanmay Chavan. Photography, event coverage, motion reels, and video editing based in Pune, India. Shot on Samsung Galaxy S23.">
  <meta property="og:image" content="assets/optimized/20260306_190702-1280.webp">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="960">
  <meta property="og:image:alt" content="Horizon's Embrace by Tanmay Chavan">

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FRAME — Tanmay Chavan | Photography &amp; Videography">
  <meta name="twitter:description"
    content="Visual portfolio of Tanmay Chavan. Photography, event coverage, motion reels, and video editing based in Pune, India. Shot on Samsung Galaxy S23.">
  <meta name="twitter:image" content="assets/optimized/20260306_190702-1280.webp">

  <!-- Website Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <script>
    (() => {
      const stored = localStorage.getItem('frame-theme') || 'dark';
      const resolved = stored === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : stored;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = stored;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Archivo+Black&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>

<style>
  body { background: #030407 !important; color: #f4f4f7 !important; padding: 24px; min-height: 100vh; }
  .showreel-section { padding-top: 10px !important; }
</style>
</head>
<body>
<section class="showreel-section section-pad" id="showreel" aria-labelledby="showreel-heading">
      <div class="showreel-section-container">
        <div class="section-header-split">
          <div>
            <p class="eyebrow">SHOWREEL // 2026</p>
            <h2 id="showreel-heading">FRAMES IN<br><span class="text-stroke">MOTION.</span></h2>
          </div>
          <p class="section-intro-text">
            A fast cut of visual rhythm, streets, automotive motion, and atmosphere. Shot on Samsung Galaxy S23.
          </p>
        </div>

        <div class="showreel-player-canvas in-page-player">
          <div class="hero-video-wrapper">
            <video id="heroShowreelVideo" class="hero-showreel-video" autoplay muted loop playsinline preload="auto">
              <source src="assets/video/hero_showreel.mp4" type="video/mp4">
              Your browser does not support HTML5 video.
            </video>
            <div class="hero-video-controls-overlay" id="heroVideoOverlay">
              <button class="hero-video-play-btn" id="heroVideoPlayBtn" type="button" aria-label="Play or Pause Showreel">
                <span class="play-icon">▶</span>
              </button>
              <div class="hero-video-bar">
                <span class="hero-video-title mono">TANMAY CHAVAN // SHOWREEL 2026</span>
                <div class="hero-video-actions">
                  <button type="button" class="btn-video-ctrl mono" id="heroAudioToggle" aria-label="Toggle Sound">
                    <span class="audio-icon">🔇</span>
                    <span class="audio-label">SOUND OFF</span>
                  </button>
                  <button type="button" class="btn-video-ctrl mono" id="heroFullscreenBtn" aria-label="Toggle Fullscreen">
                    <span>⛶ FULLSCREEN</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
<script src="script.js"></script>
</body>
</html>
